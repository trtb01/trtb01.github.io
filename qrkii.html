<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#201a25;color:#efe6f8;font-family:'Book Antiqua','Palatino Linotype',Palatino,Georgia,serif;display:flex;flex-direction:column;align-items:center}
  header{margin:30px 0 10px;text-align:center}
  h1{margin:0;font-size:2.6rem;color:#c8f6d6;font-weight:normal}
  h1 .kii{color:#ff0000;font-family:'Courier New',Courier,monospace;font-weight:bold}

  .tabs{display:flex;gap:10px;border-bottom:2px solid #5a4d6a;margin-bottom:20px}
  .tab-btn{background:transparent;border:none;border-bottom:3px solid transparent;color:#b8a0ce;font-family:inherit;font-size:1.1rem;padding:10px 18px;cursor:pointer}
  .tab-btn.active{color:#c8f6d6;border-bottom-color:#c8f6d6}
  .panel{display:none}.panel.active{display:block}
  label{display:block;margin:14px 0 6px;color:#c9aee0;font-weight:bold}

  input[type=file]{padding:8px}
  input[type=color]{height:44px;cursor:pointer;padding:2px}

  button:hover{background:#a0e6c0}
  .colors{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .swatch{display:flex;align-items:center;gap:8px}
  canvas,img,#qrcode img{max-width:100%;border-radius:8px;background:#fff;padding:6px;display:block;margin:12px 0}
  .msg{min-height:1.5em;color:#ffaeae;font-size:.95em;margin-top:6px}
  footer{margin-top:auto;padding:24px 10px;text-align:center;color:#b8a0ce;font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1>qrkii - the trtb qr code tool</h1>
  <div class="subtitle">Trtb QR code tool</div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="show(0)">Generate</button>
    <button class="tab-btn" onclick="show(1)">Decode</button>
  </div>

  <div id="gen" class="panel active">
    <label>Text or data</label>
    <textarea id="genText" placeholder="Paste text here, or use the file upload below."></textarea>

    <label>File input</label>
    <input type="file" id="genFile">

    <div class="colors">
      <div class="swatch"><label>QR color:</label><input type="color" id="fg" value="#201a25"></div>
      <div class="swatch"><label>Background:</label><input type="color" id="bg" value="#c8f6d6"></div>
    </div>

    <button onclick="makeQR()">Create QR</button>
    <div id="qrcode" style="display:none"></div>
    <canvas id="qrCanvas" style="display:none"></canvas>
    <p class="msg" id="genMsg"></p>
  </div>

  <div id="dec" class="panel">
    <label>Upload QR image</label>
    <input type="file" id="decFile" accept="image/*">
    <label>Paste image (Ctrl+V) anywhere on this tab</label>
    <div id="pasted" style="display:none"><img id="pastedImg"></div>
    <button onclick="decodeQR()">Decode QR</button>
    <button onclick="saveText()">Download text</button>
    <button onclick="copyText()">Copy text</button>
    <label>Decoded text</label>
    <textarea id="decText" readonly placeholder="Decoded text will appear here."></textarea>
    <p class="msg" id="decMsg"></p>
  </div>
</main>

<footer>© Thor Smith - trtb_Soft</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  r.onload=()=>g('genText').value=r.result;
  r.readAsText(f);
};

  try{

    qrdiv.innerHTML='';

      colorDark:g('fg').value, colorLight:g('bg').value,

          const c=img;currentBlob=()=>new Promise(r=>c.toBlob(r));

          const i=img;fetch(i.src).then(r=>r.blob()).then(b=>currentBlob=()=>Promise.resolve(b));
          drawCopy(i);

<body>
<header>
  <h1>qr<span class="kii">kii</span> - the trtb qr code tool</h1>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="show(0)">Generate</button>
    <button class="tab-btn" onclick="show(1)">Decode</button>
  </div>

  <div id="gen" class="panel active">
    <label>Text or data</label>
    <textarea id="genText" placeholder="Paste text here, or use the file upload below."></textarea>

    <label>File input</label>
    <input type="file" id="genFile">

    <div class="colors">
      <div class="swatch"><label>QR color:</label><input type="color" id="fg" value="#201a25"></div>
      <div class="swatch"><label>Background:</label><input type="color" id="bg" value="#c8f6d6"></div>
    </div>

    <button onclick="makeQR()">Create QR</button>
    <p class="msg" id="genMsg"></p>

    <div id="qrWrap">
      <div id="qrOut"></div>
      <div>
        <button onclick="downloadQR()">Download QR</button>
        <button onclick="copyQR()">Copy QR</button>
      </div>
    </div>
  </div>

  <div id="dec" class="panel">
    <label>Upload QR image</label>
    <input type="file" id="decFile" accept="image/*">

    <label>Paste image (Ctrl+V) anywhere on this tab</label>
    <img id="pastedImg" style="display:none;max-width:300px">

    <div>
      <button onclick="decodeQR()">Decode QR</button>
      <button onclick="saveText()">Download text</button>
      <button onclick="copyText()">Copy text</button>
    </div>

    <label>Decoded text</label>
    <textarea id="decText" readonly placeholder="Decoded text will appear here."></textarea>
    <p class="msg" id="decMsg"></p>
  </div>
</main>

<footer>© Thor Smith - trtb_Soft</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=id=>document.getElementById(id);
function show(i){
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
}
function setMsg(id,txt){$(id).textContent=txt;setTimeout(()=>$(id).textContent='',3000);}

$('#genFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>$('#genText').value=r.result;
  r.readAsText(f);
});

let qrBlob=null;

function makeQR(){
  const txt=$('#genText').value;
  if(!txt){setMsg('genMsg','Enter text or choose a file first');return;}
  try{
    const out=$('#qrOut');out.innerHTML='';
    new QRCode(out,{text:txt,width:300,height:300,colorDark:$('#fg').value,colorLight:$('#bg').value,correctLevel:QRCode.CorrectLevel.L});
    setTimeout(()=>{
      const img=out.querySelector('img'),cvs=out.querySelector('canvas');
      const src=img||cvs;
      const c=document.createElement('canvas');c.width=300;c.height=300;
      const ctx=c.getContext('2d');ctx.drawImage(src,0,0,300,300);
      c.toBlob(b=>qrBlob=b);
      $('#qrWrap').style.display='block';
      setMsg('genMsg','QR created. Use Download or Copy below.');
    },300);
  }catch(err){setMsg('genMsg','Error: '+err.message);}
}

function downloadQR(){
  if(!qrBlob){setMsg('genMsg','Create a QR first');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(qrBlob);
  a.download='qrcode.png';a.click();URL.revokeObjectURL(a.href);
}
function copyQR(){
  if(!qrBlob){setMsg('genMsg','Create a QR first');return;}
  try{navigator.clipboard.write([new ClipboardItem({'image/png':qrBlob})]).then(()=>setMsg('genMsg','QR copied to clipboard'));}
  catch(err){setMsg('genMsg','Copy failed. Use Download instead.');}
}

window.addEventListener('paste',e=>{
  if(!$('#dec').classList.contains('active'))return;
  for(const i of (e.clipboardData||e.dataTransfer).items){
    if(i.kind==='file'&&i.type.startsWith('image/')){
      const f=i.getAsFile();if(!f)continue;
      const img=$('#pastedImg');img.onload=()=>decodeQR();
      img.src=URL.createObjectURL(f);img.style.display='block';
    }
  }
});

function decodeQR(){
  const pasted=$('#pastedImg');
  if(pasted.style.display==='block'){doDecode(pasted);return;}
  const file=$('#decFile').files[0];
  if(!file){setMsg('decMsg','Upload or paste an image first');return;}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{doDecode(img);URL.revokeObjectURL(url);};img.src=url;
}

function doDecode(el){
  const c=document.createElement('canvas');
  c.width=el.naturalWidth||el.width;c.height=el.naturalHeight||el.height;
  c.getContext('2d').drawImage(el,0,0);
  const data=c.getContext('2d').getImageData(0,0,c.width,c.height);
  const code=jsQR(data.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
  if(code){$('#decText').value=code.data;setMsg('decMsg','Decoded successfully');}
  else{$('#decText').value='';setMsg('decMsg','No QR code detected');}
}

function saveText(){
  const txt=$('#decText').value;if(!txt){setMsg('decMsg','Nothing to download');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='decoded.txt';a.click();URL.revokeObjectURL(a.href);
}
function copyText(){
  const t=$('#decText');if(!t.value){setMsg('decMsg','Nothing to copy');return;}
  navigator.clipboard.writeText(t.value).then(()=>setMsg('decMsg','Text copied to clipboard'));
}
</script>
</body>
</html>
