<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qrkii - the trtb qr code tool</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#201a25;color:#efe6f8;font-family:'Book Antiqua','Palatino Linotype',Palatino,Georgia,serif;display:flex;flex-direction:column;align-items:center}
  header{margin:30px 0 10px;text-align:center}
  h1{margin:0;font-size:2.6rem;color:#c8f6d6;font-weight:normal}
  h1 .kii{color:#ff0000;font-family:'Courier New',Courier,monospace;font-weight:bold}
  .subtitle{color:#c9aee0;margin-top:4px;font-size:1rem}
  main{width:92%;max-width:760px;background:#362c42;border-radius:16px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.38);border:1px solid #5a4d6a}
  .tabs{display:flex;gap:10px;border-bottom:2px solid #5a4d6a;margin-bottom:20px}
  .tab-btn{background:transparent;border:none;border-bottom:3px solid transparent;color:#b8a0ce;font-family:inherit;font-size:1.1rem;padding:10px 18px;cursor:pointer}
  .tab-btn.active{color:#c8f6d6;border-bottom-color:#c8f6d6}
  .panel{display:none}.panel.active{display:block}
  label{display:block;margin:14px 0 6px;color:#c9aee0;font-weight:bold}
  textarea,input[type=text],input[type=file],input[type=color]{width:100%;background:#231e2e;color:#efe6f8;border:1px solid #5a4d6a;border-radius:8px;padding:10px;font-family:inherit;font-size:1rem}
  textarea{min-height:180px;resize:vertical}
  input[type=file]{padding:8px}
  input[type=color]{height:44px;cursor:pointer;padding:2px}
  button{background:#c8f6d6;color:#201a25;border:none;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer;margin-right:10px;margin-top:12px;font-family:inherit;font-weight:bold;transition:.2s}
  button:hover{background:#a0e6c0}
  .colors{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .swatch{display:flex;align-items:center;gap:8px}
  canvas,img,#qrcode img{max-width:100%;border-radius:8px;background:#fff;padding:6px;display:block;margin:12px 0}
  .msg{min-height:1.5em;color:#ffaeae;font-size:.95em;margin-top:6px}
  footer{margin-top:auto;padding:24px 10px;text-align:center;color:#b8a0ce;font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1>qrkii - the trtb qr code tool</h1>
  <div class="subtitle">Trtb QR code tool</div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="show(0)">Generate</button>
    <button class="tab-btn" onclick="show(1)">Decode</button>
  </div>

  <div id="gen" class="panel active">
    <label>Text or data</label>
    <textarea id="genText" placeholder="Paste text here, or use the file upload below."></textarea>

    <label>File input</label>
    <input type="file" id="genFile">

    <div class="colors">
      <div class="swatch"><label>QR color:</label><input type="color" id="fg" value="#201a25"></div>
      <div class="swatch"><label>Background:</label><input type="color" id="bg" value="#c8f6d6"></div>
    </div>

    <button onclick="makeQR()">Create QR</button>
    <div id="qrcode" style="display:none"></div>
    <canvas id="qrCanvas" style="display:none"></canvas>
    <p class="msg" id="genMsg"></p>
  </div>

  <div id="dec" class="panel">
    <label>Upload QR image</label>
    <input type="file" id="decFile" accept="image/*">
    <label>Paste image (Ctrl+V) anywhere on this tab</label>
    <div id="pasted" style="display:none"><img id="pastedImg"></div>
    <button onclick="decodeQR()">Decode QR</button>
    <button onclick="saveText()">Download text</button>
    <button onclick="copyText()">Copy text</button>
    <label>Decoded text</label>
    <textarea id="decText" readonly placeholder="Decoded text will appear here."></textarea>
    <p class="msg" id="decMsg"></p>
  </div>
</main>

<footer>© Thor Smith - trtb_Soft</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=id=>document.getElementById(id),g=$,d=$;
function show(i){document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j==i));document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j==i))}

let currentBlob=null;

function setMsg(id,txt){g(id).textContent=txt;setTimeout(()=>g(id).textContent='',3000)}

g('genFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>g('genText').value=r.result;
  r.readAsText(f);
};

function makeQR(){
  const txt=g('genText').value;
  if(!txt){setMsg('genMsg','Enter text or choose a file first');return}
  try{
    const qrdiv=g('qrcode');
    qrdiv.style.display='block';
    qrdiv.innerHTML='';
    new QRCode(qrdiv,{
      text:txt,
      width:300,height:300,
      colorDark:g('fg').value, colorLight:g('bg').value,
      correctLevel:QRCode.CorrectLevel.L
    });
    setTimeout(()=>{
      const img=qrdiv.querySelector('img')||qrdiv.querySelector('canvas');
      if(img){
        if(img.tagName==='CANVAS'){
          const c=img;currentBlob=()=>new Promise(r=>c.toBlob(r));
        }else{
          const i=img;fetch(i.src).then(r=>r.blob()).then(b=>currentBlob=()=>Promise.resolve(b));
          drawCopy(i);
        }
      }
    },200);
    setMsg('genMsg','Right-click or long-press the QR to save/copy.');
  }catch(err){setMsg('genMsg','Error: '+err.message)}
}

function drawCopy(srcImg){
  const c=g('qrCanvas');c.width=300;c.height=300;c.style.display='block';
  const ctx=c.getContext('2d');
  ctx.drawImage(srcImg,0,0,300,300);
  currentBlob=()=>new Promise(r=>c.toBlob(r));
}

window.addEventListener('paste',e=>{
  if(!g('dec').classList.contains('active'))return;
  const items=(e.clipboardData||e.dataTransfer).items;
  for(let i of items){
    if(i.kind==='file' && i.type.startsWith('image/')){
      const f=i.getAsFile();
      if(!f)return;
      const img=g('pastedImg');img.src=URL.createObjectURL(f);
      g('pasted').style.display='block';
      setTimeout(decodeQR,300);
    }
  }
});

function drawToCanvas(el,cb){
  const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width||300;c.height=img.height||300;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0);cb(c);
  };img.onerror=()=>setMsg('decMsg','Could not load image');
  img.src=el.src||(el.toDataURL?el.toDataURL():'');
}

function decodeQR(){
  const src=g('pastedImg').src;
  if(src){
    drawToCanvas(g('pastedImg'),c=>doDecode(c));
    return;
  }
  const file=g('decFile').files[0];
  if(!file){setMsg('decMsg','Upload or paste an image first');return}
  const url=URL.createObjectURL(file);
  const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);doDecode(c);URL.revokeObjectURL(url);
  };img.src=url;
}

function doDecode(c){
  const ctx=c.getContext('2d'),data=ctx.getImageData(0,0,c.width,c.height);
  const code=jsQR(data.data,data.width,data.height,{inversionAttempts:'attemptBoth'});
  if(code){g('decText').value=code.data;setMsg('decMsg','Decoded successfully')}
  else{g('decText').value='';setMsg('decMsg','No QR code detected')}
}

function saveText(){
  const txt=g('decText').value;if(!txt){setMsg('decMsg','Nothing to download');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='decoded.txt';a.click();URL.revokeObjectURL(a.href);
}

function copyText(){
  const t=g('decText');if(!t.value){setMsg('decMsg','Nothing to copy');return}
  t.select();t.setSelectionRange(0,99999);
  navigator.clipboard.writeText(t.value).then(()=>setMsg('decMsg','Copied to clipboard'));
}
</script>
</body>
</html>
