<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>encry_msg</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    color: #000000;
    font-family: serif;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
    padding: 24px;
  }

  .top-spacer {
    flex: 1;
  }

  .main-container {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .boxes-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  textarea {
    width: 100%;
    height: 260px;
    padding: 10px;
    border: 1px solid #000000;
    background-color: #ffffff;
    color: #000000;
    font-family: serif;
    font-size: 1rem;
    line-height: 1.4;
    resize: vertical;
    outline: none;
    transition: color 0.08s linear;
  }

  textarea:focus {
    border-color: #000000;
    outline: 1px solid #000000;
  }

  textarea::placeholder {
    color: #666666;
    font-family: serif;
  }

  textarea.flash-red {
    color: #ff0000 !important;
  }

  .controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: stretch;
  }

  .control-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type="password"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #000000;
    background-color: #ffffff;
    color: #000000;
    font-family: serif;
    font-size: 0.95rem;
    outline: none;
  }

  input[type="password"]::placeholder {
    color: #666666;
    font-family: serif;
  }

  .file-wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    border: 1px solid #000000;
    padding: 4px 8px;
    background-color: #ffffff;
    font-family: serif;
    font-size: 0.95rem;
    justify-content: space-between;
  }

  input[type="file"] {
    font-family: serif;
    font-size: 0.9rem;
    color: #000000;
    width: 100%;
  }

  input[type="file"]::file-selector-button {
    font-family: serif;
    background: #ffffff;
    color: #000000;
    border: 1px solid #000000;
    padding: 2px 8px;
    margin-right: 8px;
    cursor: pointer;
  }

  .clear-file {
    background: #ffffff;
    color: #000000;
    border: 1px solid #000000;
    font-family: serif;
    font-size: 0.8rem;
    padding: 1px 6px;
    cursor: pointer;
    display: none;
    flex-shrink: 0;
  }

  .algo-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding-top: 2px;
    font-size: 0.9rem;
  }

  .algo-row label {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  input[type="radio"] {
    accent-color: #000000;
    cursor: pointer;
    margin: 0;
  }

  .bottom-spacer {
    flex: 1;
  }

  footer {
    text-align: center;
    font-size: 0.9rem;
    padding-top: 16px;
  }

  @media (max-width: 640px) {
    .boxes-row, .controls-row {
      grid-template-columns: 1fr;
    }
    .algo-row {
      flex-direction: column;
      gap: 6px;
    }
  }
</style>
</head>
<body>

  <div class="top-spacer"></div>

  <div class="main-container">
    <div class="boxes-row">
      <textarea id="incoming" placeholder="incoming" spellcheck="false" autocomplete="off"></textarea>
      <textarea id="outgoing" placeholder="outgoing" spellcheck="false" autocomplete="off"></textarea>
    </div>

    <div class="controls-row">
      <div class="control-box">
        <input type="password" id="password" placeholder="password" autocomplete="off">
      </div>
      <div class="control-box">
        <div class="file-wrapper">
          <input type="file" id="keyfile" title="keyfile">
          <button type="button" id="clearKeyfile" class="clear-file" title="Clear keyfile">x</button>
        </div>
      </div>
    </div>

    <div class="algo-row">
      <label>
        <input type="radio" name="algo" value="1" checked>
        AES-256-GCM
      </label>
      <label>
        <input type="radio" name="algo" value="2">
        ChaCha20-Poly1305
      </label>
      <label>
        <input type="radio" name="algo" value="3">
        AES-256-CTR + HMAC-SHA512
      </label>
    </div>
  </div>

  <div class="bottom-spacer"></div>

  <footer>(c) Thor Smith 2026 - [trtb_software] - "encry_msg"</footer>

<script>
(function () {
  "use strict";

  const incomingBox = document.getElementById("incoming");
  const outgoingBox = document.getElementById("outgoing");
  const passwordInput = document.getElementById("password");
  const keyfileInput = document.getElementById("keyfile");
  const clearKeyfileBtn = document.getElementById("clearKeyfile");

  const PBKDF2_ITERATIONS = 600000;
  const FORMAT_VERSION = 1; // v1 envelope

  let keyfileBytes = null;

  keyfileInput.addEventListener("change", async function () {
    if (keyfileInput.files && keyfileInput.files.length > 0) {
      const buf = await keyfileInput.files[0].arrayBuffer();
      keyfileBytes = new Uint8Array(buf);
      clearKeyfileBtn.style.display = "inline-block";
    } else {
      keyfileBytes = null;
      clearKeyfileBtn.style.display = "none";
    }
  });

  clearKeyfileBtn.addEventListener("click", function () {
    keyfileInput.value = "";
    keyfileBytes = null;
    clearKeyfileBtn.style.display = "none";
  });

  function flashTextRed(element) {
    element.classList.add("flash-red");
    setTimeout(function () {
      element.classList.remove("flash-red");
    }, 280);
  }

  async function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch (_) {
        // Fall through to execCommand fallback
      }
    }
    const prevActive = document.activeElement;
    const selStart = prevActive && typeof prevActive.selectionStart === "number" ? prevActive.selectionStart : null;
    const selEnd = prevActive && typeof prevActive.selectionEnd === "number" ? prevActive.selectionEnd : null;

    const helper = document.createElement("textarea");
    helper.value = text;
    helper.style.position = "fixed";
    helper.style.left = "-9999px";
    helper.style.top = "0";
    document.body.appendChild(helper);
    helper.focus();
    helper.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(helper);

    if (prevActive && typeof prevActive.focus === "function") {
      prevActive.focus();
      if (selStart !== null && selEnd !== null && typeof prevActive.setSelectionRange === "function") {
        prevActive.setSelectionRange(selStart, selEnd);
      }
    }
    if (!ok) {
      throw new Error("Clipboard copy failed");
    }
  }

  function bytesToBase64(bytes) {
    let binary = "";
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function base64ToBytes(b64) {
    const cleaned = b64.trim().replace(/\s+/g, "");
    const binary = atob(cleaned);
    const out = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      out[i] = binary.charCodeAt(i);
    }
    return out;
  }

  function concatBytes() {
    let totalLen = 0;
    for (let i = 0; i < arguments.length; i++) {
      totalLen += arguments[i].length;
    }
    const result = new Uint8Array(totalLen);
    let offset = 0;
    for (let i = 0; i < arguments.length; i++) {
      result.set(arguments[i], offset);
      offset += arguments[i].length;
    }
    return result;
  }

  function u32le(n) {
    const b = new Uint8Array(4);
    b[0] = n & 0xff;
    b[1] = (n >>> 8) & 0xff;
    b[2] = (n >>> 16) & 0xff;
    b[3] = (n >>> 24) & 0xff;
    return b;
  }

  // Combine password and/or keyfile into a single canonical secret using SHA-512
  // so that if both are provided, both are strictly required to derive the key.
  async function buildCombinedSecret() {
    const pwd = passwordInput.value || "";
    const hasPwd = pwd.length > 0;
    const hasKeyfile = keyfileBytes !== null && keyfileBytes.length > 0;

    if (!hasPwd && !hasKeyfile) {
      throw new Error("Please supply a password, a keyfile, or both.");
    }

    const enc = new TextEncoder();
    const pwdBytes = enc.encode(pwd);
    const pwdDigest = new Uint8Array(await crypto.subtle.digest("SHA-512", pwdBytes));

    let kfDigest = new Uint8Array(64);
    if (hasKeyfile) {
      kfDigest = new Uint8Array(await crypto.subtle.digest("SHA-512", keyfileBytes));
    }

    // Mode flag ensures (pwd only), (keyfile only), and (pwd + keyfile) are domain-separated
    const modeFlag = new Uint8Array([(hasPwd ? 1 : 0) | (hasKeyfile ? 2 : 0)]);
    const combinedInput = concatBytes(
      enc.encode("ENCRY_MSG_V1_SECRET_COMBINE"),
      modeFlag,
      u32le(pwdBytes.length),
      pwdDigest,
      u32le(hasKeyfile ? keyfileBytes.length : 0),
      kfDigest
    );

    return new Uint8Array(await crypto.subtle.digest("SHA-512", combinedInput));
  }

  async function deriveRawKeyBytes(salt, lengthBytes) {
    const masterSecret = await buildCombinedSecret();
    const baseKey = await crypto.subtle.importKey(
      "raw",
      masterSecret,
      { name: "PBKDF2" },
      false,
      ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: PBKDF2_ITERATIONS,
        hash: "SHA-512"
      },
      baseKey,
      lengthBytes * 8
    );
    return new Uint8Array(bits);
  }

  // =========================================================================
  // Algorithm 1: AES-256-GCM (96-bit IV, 128-bit authentication tag)
  // =========================================================================
  async function encryptAesGcm(plaintextBytes, salt, headerBytes) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const rawKey = await deriveRawKeyBytes(salt, 32);
    const key = await crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["encrypt"]);
    const aad = concatBytes(headerBytes, salt, iv);
    const ctBuf = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv, additionalData: aad, tagLength: 128 },
      key,
      plaintextBytes
    );
    return concatBytes(headerBytes, salt, iv, new Uint8Array(ctBuf));
  }

  async function decryptAesGcm(payload, offset) {
    const headerBytes = payload.subarray(0, offset);
    if (payload.length < offset + 16 + 12 + 16) {
      throw new Error("Invalid ciphertext length");
    }
    const salt = payload.subarray(offset, offset + 16);
    const iv = payload.subarray(offset + 16, offset + 28);
    const ciphertext = payload.subarray(offset + 28);
    const rawKey = await deriveRawKeyBytes(salt, 32);
    const key = await crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]);
    const aad = concatBytes(headerBytes, salt, iv);
    const ptBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv, additionalData: aad, tagLength: 128 },
      key,
      ciphertext
    );
    return new Uint8Array(ptBuf);
  }

  // =========================================================================
  // Algorithm 2: ChaCha20-Poly1305 (RFC 8439 AEAD, 256-bit key, 96-bit nonce)
  // =========================================================================
  function rotl32(v, c) {
    return ((v << c) | (v >>> (32 - c))) >>> 0;
  }

  function quarterRound(x, a, b, c, d) {
    x[a] = (x[a] + x[b]) >>> 0; x[d] = rotl32(x[d] ^ x[a], 16);
    x[c] = (x[c] + x[d]) >>> 0; x[b] = rotl32(x[b] ^ x[c], 12);
    x[a] = (x[a] + x[b]) >>> 0; x[d] = rotl32(x[d] ^ x[a], 8);
    x[c] = (x[c] + x[d]) >>> 0; x[b] = rotl32(x[b] ^ x[c], 7);
  }

  function chacha20Block(keyBytes, counter, nonceBytes) {
    const state = new Uint32Array(16);
    state[0] = 0x61707865;
    state[1] = 0x3320646e;
    state[2] = 0x79622d32;
    state[3] = 0x6b206574;

    const kv = new DataView(keyBytes.buffer, keyBytes.byteOffset, 32);
    for (let i = 0; i < 8; i++) {
      state[4 + i] = kv.getUint32(i * 4, true);
    }
    state[12] = counter >>> 0;
    const nv = new DataView(nonceBytes.buffer, nonceBytes.byteOffset, 12);
    state[13] = nv.getUint32(0, true);
    state[14] = nv.getUint32(4, true);
    state[15] = nv.getUint32(8, true);

    const working = new Uint32Array(state);
    for (let i = 0; i < 10; i++) {
      quarterRound(working, 0, 4, 8, 12);
      quarterRound(working, 1, 5, 9, 13);
      quarterRound(working, 2, 6, 10, 14);
      quarterRound(working, 3, 7, 11, 15);
      quarterRound(working, 0, 5, 10, 15);
      quarterRound(working, 1, 6, 11, 12);
      quarterRound(working, 2, 7, 8, 13);
      quarterRound(working, 3, 4, 9, 14);
    }

    const out = new Uint8Array(64);
    const ov = new DataView(out.buffer);
    for (let i = 0; i < 16; i++) {
      ov.setUint32(i * 4, (working[i] + state[i]) >>> 0, true);
    }
    return out;
  }

  function chacha20Xor(keyBytes, counter, nonceBytes, inputBytes) {
    const out = new Uint8Array(inputBytes.length);
    let blockCounter = counter >>> 0;
    for (let offset = 0; offset < inputBytes.length; offset += 64) {
      const stream = chacha20Block(keyBytes, blockCounter, nonceBytes);
      blockCounter = (blockCounter + 1) >>> 0;
      const chunkLen = Math.min(64, inputBytes.length - offset);
      for (let i = 0; i < chunkLen; i++) {
        out[offset + i] = inputBytes[offset + i] ^ stream[i];
      }
    }
    return out;
  }

  function poly1305Mac(msgBytes, otkBytes) {
    const rBytes = new Uint8Array(otkBytes.subarray(0, 16));
    rBytes[3] &= 15;
    rBytes[7] &= 15;
    rBytes[11] &= 15;
    rBytes[15] &= 15;
    rBytes[4] &= 252;
    rBytes[8] &= 252;
    rBytes[12] &= 252;

    let r = 0n;
    for (let i = 15; i >= 0; i--) {
      r = (r << 8n) | BigInt(rBytes[i]);
    }

    let s = 0n;
    for (let i = 31; i >= 16; i--) {
      s = (s << 8n) | BigInt(otkBytes[i]);
    }

    const p = (1n << 130n) - 5n;
    let acc = 0n;

    for (let offset = 0; offset < msgBytes.length; offset += 16) {
      const chunkLen = Math.min(16, msgBytes.length - offset);
      let n = 1n; // high bit (1 << (8 * chunkLen))
      for (let i = chunkLen - 1; i >= 0; i--) {
        n = (n << 8n) | BigInt(msgBytes[offset + i]);
      }
      acc = ((acc + n) * r) % p;
    }

    acc = (acc + s) & ((1n << 128n) - 1n);
    const tag = new Uint8Array(16);
    for (let i = 0; i < 16; i++) {
      tag[i] = Number(acc & 0xffn);
      acc >>= 8n;
    }
    return tag;
  }

  function pad16(len) {
    const rem = len % 16;
    return rem === 0 ? new Uint8Array(0) : new Uint8Array(16 - rem);
  }

  function u64le(len) {
    const b = new Uint8Array(8);
    let v = BigInt(len);
    for (let i = 0; i < 8; i++) {
      b[i] = Number(v & 0xffn);
      v >>= 8n;
    }
    return b;
  }

  function constantTimeEqual(a, b) {
    if (a.length !== b.length) return false;
    let diff = 0;
    for (let i = 0; i < a.length; i++) {
      diff |= a[i] ^ b[i];
    }
    return diff === 0;
  }

  async function encryptChaCha20Poly1305(plaintextBytes, salt, headerBytes) {
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveRawKeyBytes(salt, 32);
    const otk = chacha20Block(key, 0, nonce).subarray(0, 32);
    const ciphertext = chacha20Xor(key, 1, nonce, plaintextBytes);
    const aad = concatBytes(headerBytes, salt, nonce);
    const macData = concatBytes(
      aad,
      pad16(aad.length),
      ciphertext,
      pad16(ciphertext.length),
      u64le(aad.length),
      u64le(ciphertext.length)
    );
    const tag = poly1305Mac(macData, otk);
    return concatBytes(headerBytes, salt, nonce, ciphertext, tag);
  }

  async function decryptChaCha20Poly1305(payload, offset) {
    const headerBytes = payload.subarray(0, offset);
    if (payload.length < offset + 16 + 12 + 16) {
      throw new Error("Invalid ciphertext length");
    }
    const salt = payload.subarray(offset, offset + 16);
    const nonce = payload.subarray(offset + 16, offset + 28);
    const ciphertext = payload.subarray(offset + 28, payload.length - 16);
    const tag = payload.subarray(payload.length - 16);

    const key = await deriveRawKeyBytes(salt, 32);
    const otk = chacha20Block(key, 0, nonce).subarray(0, 32);
    const aad = concatBytes(headerBytes, salt, nonce);
    const macData = concatBytes(
      aad,
      pad16(aad.length),
      ciphertext,
      pad16(ciphertext.length),
      u64le(aad.length),
      u64le(ciphertext.length)
    );
    const expectedTag = poly1305Mac(macData, otk);
    if (!constantTimeEqual(tag, expectedTag)) {
      throw new Error("Authentication failed");
    }
    return chacha20Xor(key, 1, nonce, ciphertext);
  }

  // =========================================================================
  // Algorithm 3: AES-256-CTR + HMAC-SHA-512 (Encrypt-then-MAC, 64-byte keys)
  // =========================================================================
  async function encryptAesCtrHmac(plaintextBytes, salt, headerBytes) {
    const iv = crypto.getRandomValues(new Uint8Array(16));
    const keyMaterial = await deriveRawKeyBytes(salt, 64);
    const encKeyBytes = keyMaterial.subarray(0, 32);
    const macKeyBytes = keyMaterial.subarray(32, 64);

    const encKey = await crypto.subtle.importKey("raw", encKeyBytes, { name: "AES-CTR" }, false, ["encrypt"]);
    const macKey = await crypto.subtle.importKey(
      "raw",
      macKeyBytes,
      { name: "HMAC", hash: "SHA-512" },
      false,
      ["sign"]
    );

    const ctBuf = await crypto.subtle.encrypt(
      { name: "AES-CTR", counter: iv, length: 64 },
      encKey,
      plaintextBytes
    );
    const ciphertext = new Uint8Array(ctBuf);
    const dataToMac = concatBytes(headerBytes, salt, iv, ciphertext);
    const fullMac = new Uint8Array(await crypto.subtle.sign("HMAC", macKey, dataToMac));
    const tag = fullMac.subarray(0, 32); // 256-bit HMAC-SHA-512 tag
    return concatBytes(dataToMac, tag);
  }

  async function decryptAesCtrHmac(payload, offset) {
    const headerBytes = payload.subarray(0, offset);
    if (payload.length < offset + 16 + 16 + 32) {
      throw new Error("Invalid ciphertext length");
    }
    const salt = payload.subarray(offset, offset + 16);
    const iv = payload.subarray(offset + 16, offset + 32);
    const ciphertext = payload.subarray(offset + 32, payload.length - 32);
    const tag = payload.subarray(payload.length - 32);

    const keyMaterial = await deriveRawKeyBytes(salt, 64);
    const encKeyBytes = keyMaterial.subarray(0, 32);
    const macKeyBytes = keyMaterial.subarray(32, 64);

    const macKey = await crypto.subtle.importKey(
      "raw",
      macKeyBytes,
      { name: "HMAC", hash: "SHA-512" },
      false,
      ["sign"]
    );
    const dataToMac = concatBytes(headerBytes, salt, iv, ciphertext);
    const fullMac = new Uint8Array(await crypto.subtle.sign("HMAC", macKey, dataToMac));
    const expectedTag = fullMac.subarray(0, 32);

    if (!constantTimeEqual(tag, expectedTag)) {
      throw new Error("Authentication failed");
    }

    const encKey = await crypto.subtle.importKey("raw", encKeyBytes, { name: "AES-CTR" }, false, ["decrypt"]);
    const ptBuf = await crypto.subtle.decrypt(
      { name: "AES-CTR", counter: iv, length: 64 },
      encKey,
      ciphertext
    );
    return new Uint8Array(ptBuf);
  }

  function getSelectedAlgoId() {
    const checked = document.querySelector('input[name="algo"]:checked');
    return checked ? parseInt(checked.value, 10) : 1;
  }

  async function encryptMessage(plaintext) {
    const algoId = getSelectedAlgoId();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const headerBytes = new Uint8Array([FORMAT_VERSION, algoId]);
    const plaintextBytes = new TextEncoder().encode(plaintext);

    let packet;
    if (algoId === 1) {
      packet = await encryptAesGcm(plaintextBytes, salt, headerBytes);
    } else if (algoId === 2) {
      packet = await encryptChaCha20Poly1305(plaintextBytes, salt, headerBytes);
    } else if (algoId === 3) {
      packet = await encryptAesCtrHmac(plaintextBytes, salt, headerBytes);
    } else {
      throw new Error("Unknown encryption algorithm");
    }

    return bytesToBase64(packet);
  }

  async function decryptMessage(ciphertextB64) {
    const payload = base64ToBytes(ciphertextB64);
    if (payload.length < 2) {
      throw new Error("Invalid encrypted message");
    }
    const version = payload[0];
    const algoId = payload[1];
    if (version !== FORMAT_VERSION) {
      throw new Error("Unsupported message version");
    }

    // Also ensure the selected radio matches or allow header-driven / selected-algo validation
    const selectedAlgo = getSelectedAlgoId();
    if (algoId !== selectedAlgo) {
      throw new Error("Selected algorithm does not match message algorithm");
    }

    let plaintextBytes;
    if (algoId === 1) {
      plaintextBytes = await decryptAesGcm(payload, 2);
    } else if (algoId === 2) {
      plaintextBytes = await decryptChaCha20Poly1305(payload, 2);
    } else if (algoId === 3) {
      plaintextBytes = await decryptAesCtrHmac(payload, 2);
    } else {
      throw new Error("Unsupported algorithm identifier");
    }

    return new TextDecoder("utf-8", { fatal: true }).decode(plaintextBytes);
  }

  let busyOutgoing = false;
  outgoingBox.addEventListener("keydown", async function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (busyOutgoing) return;
      const text = outgoingBox.value;
      if (!text) return;

      busyOutgoing = true;
      flashTextRed(outgoingBox);
      try {
        const encrypted = await encryptMessage(text);
        await copyToClipboard(encrypted);
      } catch (err) {
        alert(err && err.message ? err.message : "Encryption failed.");
      } finally {
        busyOutgoing = false;
      }
    }
  });

  let busyIncoming = false;
  incomingBox.addEventListener("keydown", async function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (busyIncoming) return;
      const text = incomingBox.value.trim();
      if (!text) return;

      busyIncoming = true;
      flashTextRed(incomingBox);
      try {
        const decrypted = await decryptMessage(text);
        incomingBox.value = decrypted;
      } catch (err) {
        alert("Decryption failed: verify password, keyfile, and algorithm.");
      } finally {
        busyIncoming = false;
      }
    }
  });
})();
