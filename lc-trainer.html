                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC Call Number Ordering Practice</title>
<style>
  html, body { margin:0; padding:0; background:#fff; color:#000; font-family:serif; height:100%; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; transition:background-color .15s ease; }
  body.flash-good { background-color:#4caf50; }
  body.flash-bad  { background-color:#e0a060; }
  .card { border:1px solid #000; padding:24px 28px; background:#fff; max-width:360px; width:100%; box-sizing:border-box; }
  h1 { font-size:1.1em; font-weight:bold; margin:0 0 4px 0; text-align:center; }
  p.hint { font-size:.8em; margin:0 0 16px 0; text-align:center; color:#444; }
  ul { list-style:none; margin:0 0 16px 0; padding:0; }
  li { border:1px solid #000; padding:8px 10px; margin-bottom:4px; cursor:grab; user-select:none; font-size:1em; background:#fff; display:flex; align-items:center; gap:8px; }
  li.dragging { opacity:.4; }
  li.drop-above { border-top:3px solid #000; }
  li.drop-below { border-bottom:3px solid #000; }
  .buttons { display:flex; gap:8px; justify-content:center; }
  button { font-family:serif; font-size:.95em; padding:6px 14px; border:1px solid #000; background:#fff; color:#000; cursor:pointer; border-radius:0; }
  button:hover { background:#eee; }
  button:active { background:#ddd; }
  .result { text-align:center; font-size:.85em; min-height:1.2em; margin-top:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Order the LC Call Numbers</h1>
  <p class="hint">Drag to sort lowest to highest, then submit.</p>
  <ul id="list"></ul>
  <div class="buttons">
    <button id="submit">Submit</button>
    <button id="new">New Set</button>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
(function () {
  "use strict";

  var CLASSES = ["QA", "QC", "TK", "HB", "PN", "PS", "Z", "ML", "NA", "RA", "QA", "TK"];
  var NUMERICS = [76, 76.9, 1993.5, 3558, 5105.888, 3711, 253.3, 72.4, 611.8, 811.52];
  var CUTTERS = ["A76", "S64", "B47", "C48", "G67", "H37", "K78", "N54", "V36", "M22"];

  var listEl = document.getElementById("list");
  var resultEl = document.getElementById("result");
  var bodyEl = document.body;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function randYear(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

  function makeCallNumber() {
    var cls = pick(CLASSES);
    var num = pick(NUMERICS);
    var cut = pick(CUTTERS);
    var date = randYear(1950, 2024);
    var label = cls + " " + num + " ." + cut + " " + date;
    var key = cls + "|" + num + "|" + cut + "|" + date;
    return { label: label, key: key };
  }

  function compareKeys(a, b) {
    var pa = a.split("|"), pb = b.split("|");
    if (pa[0] !== pb[0]) return pa[0] < pb[0] ? -1 : 1;
    var na = parseFloat(pa[1]), nb = parseFloat(pb[1]);
    if (na !== nb) return na < nb ? -1 : 1;
    for (var i = 2; i < Math.max(pa.length, pb.length); i++) {
      var sa = pa[i] || "", sb = pb[i] || "";
      if (sa !== sb) return sa < sb ? -1 : 1;
    }
    return 0;
  }
  function correctOrder(items) {
    return items.slice().sort(function (a, b) { return compareKeys(a.key, b.key); });
  }

  var dragIndex = null;

  function clearDropMarks() {
    Array.prototype.forEach.call(listEl.children, function (li) {
      li.classList.remove("drop-above", "drop-below");
    });
  }

  function render(items) {
    listEl.innerHTML = "";
    items.forEach(function (item) {
      var li = document.createElement("li");
      li.draggable = true;
      li.dataset.key = item.key;
      li.dataset.label = item.label;
      li.innerHTML = '<span class="grip">&#9776;</span><span>' + item.label + "</span>";
      listEl.appendChild(li);
    });
  }

  function readOrder() {
    return Array.prototype.map.call(listEl.children, function (li) {
      return { key: li.dataset.key, label: li.dataset.label };
    });
  }

  listEl.addEventListener("dragstart", function (e) {
    var li = e.target.closest("li");
    if (!li) return;
    dragIndex = Array.prototype.indexOf.call(listEl.children, li);
    li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", String(dragIndex)); } catch (err) {}
  });

  listEl.addEventListener("dragend", function () {
    var d = listEl.querySelector("li.dragging");
    if (d) d.classList.remove("dragging");
    clearDropMarks();
    dragIndex = null;
  });

  listEl.addEventListener("dragover", function (e) {
    e.preventDefault();
    if (dragIndex === null) return;
    var li = e.target.closest("li");
    clearDropMarks();
    if (!li) return;
    var overIndex = Array.prototype.indexOf.call(listEl.children, li);
    if (overIndex === dragIndex) return;
    if (overIndex < dragIndex) li.classList.add("drop-above");
    else li.classList.add("drop-below");
  });

  listEl.addEventListener("drop", function (e) {
    e.preventDefault();
    if (dragIndex === null) return;
    var li = e.target.closest("li");
    if (!li) return;
    var from = dragIndex;
    var overIndex = Array.prototype.indexOf.call(listEl.children, li);
    clearDropMarks();
    if (overIndex === from) { dragIndex = null; return; }

    var moving = listEl.children[from];
    var goingDown = overIndex > from;

    listEl.removeChild(moving);
    var kids = listEl.children;
    if (goingDown) {
      var insertAt = overIndex;
      if (insertAt >= kids.length) listEl.appendChild(moving);
      else listEl.insertBefore(moving, kids[insertAt]);
    } else {
      listEl.insertBefore(moving, kids[overIndex]);
    }

    dragIndex = null;
  });

  var flashTimer = null;
  function flash(cls) {
    if (flashTimer) clearTimeout(flashTimer);
    bodyEl.classList.remove("flash-good", "flash-bad");
    void bodyEl.offsetWidth;
    bodyEl.classList.add(cls);
    flashTimer = setTimeout(function () { bodyEl.classList.remove(cls); }, 500);
  }

  function newSet() {
    var chosen = [], seen = {};
    while (chosen.length < 5) {
      var item = makeCallNumber();
      if (seen[item.key]) continue;
      seen[item.key] = true;
      chosen.push(item);
    }
    var correct = correctOrder(chosen);
    var presented = shuffle(chosen.slice());
    var already = presented.every(function (it, i) { return it.key === correct[i].key; });
    if (already) presented = shuffle(presented.slice());
    render(presented);
    resultEl.textContent = "";
  }

  document.getElementById("submit").addEventListener("click", function () {
    var user = readOrder();
    var correct = correctOrder(user);
    var ok = user.every(function (it, i) { return it.key === correct[i].key; });
    if (ok) { flash("flash-good"); resultEl.textContent = "Correct!"; }
    else { flash("flash-bad"); resultEl.textContent = "Not quite \u2014 try again."; }
  });

  document.getElementById("new").addEventListener("click", newSet);

  newSet();
})();
</script>
</body>
</html>
