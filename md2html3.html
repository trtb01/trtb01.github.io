<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown to HTML</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --ink-soft: #5a5a5a;
    --muted: #7d7d7d;
    --muted-fade: #b0b0b0;
    --done: #a9a9a9;
    --tint: #f4f4f4;
    --wash: #f7f7f7;
    --rule-soft: #e8e8e8;
  }

  html, body { background: var(--paper); }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(20px, 6vh, 72px) clamp(16px, 5vw, 40px);
    font-family: serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 800px;
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: clamp(20px, 4vw, 40px);
  }

  header { margin: 0 0 28px 0; }

  h1 {
    margin: 0;
    font-size: 1.1em;
    font-weight: normal;
    animation: breathe 16s ease-in-out infinite;
  }

  label {
    display: block;
    font-size: 0.85em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px 0;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    padding: 8px 10px;
    font-family: serif;
    font-size: 1em;
    line-height: 1.45;
    resize: vertical;
    margin: 0 0 24px 0;
    transition: border-color 0.6s ease;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin: 0 0 28px 0;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 0.8em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    padding: 6px 14px;
    cursor: pointer;
    transition: color 0.6s ease, background-color 0.6s ease;
  }

  button:hover { background: var(--ink); color: var(--paper); }

  iframe {
    width: 100%;
    height: 520px;
    border: 1px solid var(--ink);
    background: var(--paper);
    margin: 0 0 24px 0;
    box-sizing: border-box;
  }

  .output-header {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
  }

  .output-header label { margin: 0; }

  .copy-msg {
    font-size: 0.8em;
    color: var(--muted);
    margin-left: 12px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .copy-msg.show { opacity: 1; }

  .hint {
    margin: -16px 0 24px 0;
    font-size: 0.8em;
    color: var(--muted);
  }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  @keyframes breathe {
    0%, 100% { color: var(--ink); }
    50%      { color: var(--ink-soft); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Markdown to HTML</h1>
    </header>

    <section>
      <label for="md-input">Markdown</label>
      <textarea id="md-input" rows="14" aria-label="Markdown input" placeholder="# Title&#10;&#10;Write your text here..."></textarea>
      <p class="hint">Supports headings, lists, task lists, tables, blockquotes, code, links, images, strikethrough.</p>
    </section>

    <div class="controls">
      <button id="btn-convert" type="button">Convert</button>
      <button id="btn-clear" type="button">Clear</button>
    </div>

    <section>
      <label for="preview-frame">Preview</label>
      <iframe id="preview-frame" title="Rendered HTML preview"></iframe>

      <div class="output-header">
        <label for="html-output">HTML Source</label>
        <span id="copy-msg" class="copy-msg">Copied.</span>
      </div>
      <textarea id="html-output" rows="8" readonly aria-label="Generated HTML source"></textarea>
      <div class="controls">
        <button id="btn-copy" type="button">Copy Source</button>
        <button id="btn-download" type="button">Download HTML</button>
      </div>
    </section>
  </main>

<script>
(function () {
  "use strict";
  var KEY = "md-html-converter:v1";
  var mdInput = document.getElementById("md-input");
  var htmlOutput = document.getElementById("html-output");
  var previewFrame = document.getElementById("preview-frame");
  var btnConvert = document.getElementById("btn-convert");
  var btnClear = document.getElementById("btn-clear");
  var btnCopy = document.getElementById("btn-copy");
  var btnDownload = document.getElementById("btn-download");
  var copyMsg = document.getElementById("copy-msg");

  function parseMd(src) {
    src = src.replace(/\r\n?/g, "\n");

    var CODE = [];
    src = src.replace(/^[ \t]*```([^\n]*)\n?([\s\S]*?)\n?[ \t]*```[ \t]*$/gm, function (m, lang, code) {
      CODE.push({ lang: lang.trim(), code: code });
      return "\x00CODE" + (CODE.length - 1) + "\x00";
    });

    src = src.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    var LIST_ITEM = /^( {0,8})([-*+]|\d{1,9}[.)])\s+(.*)$/;
    var HR = /^ {0,3}((?:-[ \t]*){3,}|(?:\*[ \t]*){3,}|(?:_[ \t]*){3,})$/;
    var ATX = /^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
    var SETEXT = /^ {0,3}(=+|-+)\s*$/;
    var BQ = /^ {0,3}(?:&gt;)+/;

    function renderCode(block) {
      var escaped = block.code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      var cls = block.lang ? ' class="language-' + block.lang.replace(/"/g, "&quot;") + '"' : "";
      return "<pre><code" + cls + ">" + escaped + "</code></pre>\n";
    }

    function splitRow(line) {
      line = line.trim();
      if (line.charAt(0) === "|") line = line.slice(1);
      if (line.charAt(line.length - 1) === "|") line = line.slice(0, -1);
      var cells = [], cur = "", k;
      for (k = 0; k < line.length; k++) {
        if (line.charAt(k) === "\\" && line.charAt(k + 1) === "|") { cur += "\x02"; k++; }
        else if (line.charAt(k) === "|") { cells.push(cur); cur = ""; }
        else cur += line.charAt(k);
      }
      cells.push(cur);
      for (k = 0; k < cells.length; k++) cells[k] = cells[k].trim().replace(/\x02/g, "\\|");
      return cells;
    }

    function isTableSep(line) {
      if (line.indexOf("|") === -1 || line.indexOf("-") === -1) return false;
      var cells = splitRow(line);
      if (!cells.length) return false;
      for (var s = 0; s < cells.length; s++) {
        if (!/^:?-+:?$/.test(cells[s].trim())) return false;
      }
      return true;
    }

    function alignStyle(al) {
      return al ? ' style="text-align:' + al + '"' : "";
    }

    function parseTable(lines, i) {
      var header = splitRow(lines[i]);
      var sepCells = splitRow(lines[i + 1]);
      var aligns = [], a;
      for (a = 0; a < header.length; a++) {
        var c = (sepCells[a] || "").trim();
        var left = c.charAt(0) === ":";
        var right = c.charAt(c.length - 1) === ":";
        aligns.push(left && right ? "center" : right ? "right" : left ? "left" : "");
      }
      var j = i + 2;
      var rows = [];
      while (j < lines.length && lines[j].trim() !== "" && lines[j].indexOf("|") !== -1 && !isTableSep(lines[j])) {
        rows.push(splitRow(lines[j]));
        j++;
      }
      var n = header.length;
      var h = "<table>\n<thead>\n<tr>\n";
      var cc;
      for (cc = 0; cc < n; cc++) h += "<th" + alignStyle(aligns[cc]) + ">" + inlineFormat(header[cc] || "") + "</th>\n";
      h += "</tr>\n</thead>\n";
      if (rows.length) {
        h += "<tbody>\n";
        for (var r = 0; r < rows.length; r++) {
          h += "<tr>\n";
          for (cc = 0; cc < n; cc++) h += "<td" + alignStyle(aligns[cc]) + ">" + inlineFormat(rows[r][cc] || "") + "</td>\n";
          h += "</tr>\n";
        }
        h += "</tbody>\n";
      }
      h += "</table>\n";
      return { html: h, next: j };
    }

    function parseListBlock(lines, i) {
      var first = lines[i].match(LIST_ITEM);
      var baseIndent = first[1].length;
      var ordered = /\d/.test(first[2]);
      var startNum = ordered ? parseInt(first[2], 10) : 1;
      var markerLen = first[2].length + 1;
      var items = [];
      var cur = [];
      var j = i;

      function flushItem() { if (cur.length) { items.push(cur); cur = []; } }

      while (j < lines.length) {
        var line = lines[j];

        if (/^\s*$/.test(line)) {
          var nxt = lines[j + 1];
          if (nxt !== undefined) {
            var nm = nxt.match(LIST_ITEM);
            if ((nm && nm[1].length >= baseIndent) || /^ {2,}/.test(nxt)) {
              cur.push("");
              j++;
              continue;
            }
          }
          break;
        }

        var m = line.match(LIST_ITEM);
        if (m && m[1].length === baseIndent && (/\d/.test(m[2]) === ordered)) {
          flushItem();
          cur.push(m[3]);
          j++;
          continue;
        }
        if (m && m[1].length > baseIndent) {
          cur.push(line);
          j++;
          continue;
        }
        if (!m) {
          var ind = line.match(/^( *)/)[1].length;
          if (ind >= baseIndent + markerLen) {
            cur.push(line.slice(baseIndent + markerLen));
            j++;
            continue;
          }
        }
        break;
      }
      flushItem();

      var anyTask = false;
      var inner = "";
      for (var k = 0; k < items.length; k++) {
        var it = items[k].slice();
        while (it.length > 1 && /^\s*$/.test(it[it.length - 1])) it.pop();
        var head = it[0];
        var rest = it.slice(1);
        while (rest.length && /^\s*$/.test(rest[0])) rest.shift();

        var cls = "";
        var prefix = "";
        var task = head.match(/^\[([ xX])\]\s+(.*)$/);
        if (task) {
          anyTask = true;
          cls = ' class="task-item"';
          prefix = '<input type="checkbox" disabled' + (/[xX]/.test(task[1]) ? " checked" : "") + "> ";
          head = task[2];
        }

        inner += "<li" + cls + ">" + prefix + inlineFormat(head);
        if (rest.length) inner += "\n" + parseLines(rest);
        inner += "</li>\n";
      }

      var tag = ordered ? "ol" : "ul";
      var attrs = "";
      if (!ordered && anyTask) attrs = ' class="task-list"';
      if (ordered && startNum !== 1) attrs += ' start="' + startNum + '"';
      return { html: "<" + tag + attrs + ">\n" + inner + "</" + tag + ">\n", next: j };
    }

    function inlineFormat(text) {
      if (!text) return "";
      var esc = [];
      text = text.replace(/\\([\\`*_{}\[\]()#+\-.!~|])/g, function (m, ch) {
        esc.push(ch);
        return "\x00ESC" + (esc.length - 1) + "\x00";
      });

      var codes = [];
      text = text.replace(/`([^`]+)`/g, function (m, code) {
        codes.push("<code>" + code + "</code>");
        return "\x00INLINE" + (codes.length - 1) + "\x00";
      });

      text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function (m, alt, url, title) {
        var out = '<img src="' + url.replace(/"/g, "&quot;") + '" alt="' + alt.replace(/[*_~`#]/g, "").replace(/"/g, "&quot;") + '"';
        if (title) out += ' title="' + title.replace(/"/g, "&quot;") + '"';
        return out + ">";
      });

      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function (m, label, url, title) {
        var out = '<a href="' + url.replace(/"/g, "&quot;") + '"';
        if (title) out += ' title="' + title.replace(/"/g, "&quot;") + '"';
        return out + ">" + label + "</a>";
      });

      text = text.replace(/&lt;((?:https?:\/\/|mailto:)[^\s]+)&gt;/g, '<a href="$1">$1</a>');

      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      text = text.replace(/_([^_]+)_/g, "<em>$1</em>");
      text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");

      text = text.replace(/\x00INLINE(\d+)\x00/g, function (m, idx) { return codes[parseInt(idx, 10)]; });
      text = text.replace(/\x00ESC(\d+)\x00/g, function (m, idx) { return esc[parseInt(idx, 10)]; });
      return text;
    }

    function parseLines(lines) {
      var html = "";
      var para = [];
      var i = 0;

      function flushPara() {
        if (para.length) {
          html += "<p>" + para.join("").replace(/\s+$/, "") + "</p>\n";
          para = [];
        }
      }

      while (i < lines.length) {
        var line = lines[i];

        if (/^\s*$/.test(line)) { flushPara(); i++; continue; }

        var cm = line.match(/^\s*\x00CODE(\d+)\x00\s*$/);
        if (cm) {
          flushPara();
          html += renderCode(CODE[parseInt(cm[1], 10)]);
          i++;
          continue;
        }

        var atx = line.match(ATX);
        if (atx) {
          flushPara();
          var lvl = atx[1].length;
          html += "<h" + lvl + ">" + inlineFormat(atx[2]) + "</h" + lvl + ">\n";
          i++;
          continue;
        }

        if (BQ.test(line)) {
          flushPara();
          var bqLines = [];
          while (i < lines.length && BQ.test(lines[i])) {
            bqLines.push(lines[i].replace(/^ {0,3}&gt; ?/, ""));
            i++;
          }
          html += "<blockquote>\n" + parseLines(bqLines) + "</blockquote>\n";
          continue;
        }

        if (para.length && SETEXT.test(line)) {
          var lvl2 = line.trim().charAt(0) === "=" ? 1 : 2;
          html += "<h" + lvl2 + ">" + para.join("").replace(/\s+$/, "") + "</h" + lvl2 + ">\n";
          para = [];
          i++;
          continue;
        }

        if (HR.test(line)) {
          flushPara();
          html += "<hr>\n";
          i++;
          continue;
        }

        if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          flushPara();
          var t = parseTable(lines, i);
          html += t.html;
          i = t.next;
          continue;
        }

        if (LIST_ITEM.test(line)) {
          flushPara();
          var l = parseListBlock(lines, i);
          html += l.html;
          i = l.next;
          continue;
        }

        var hard = / {2,}$/.test(line);
        para.push(inlineFormat(line) + (hard ? "<br>" : " "));
        i++;
      }

      flushPara();
      return html;
    }

    return parseLines(src.split("\n"));
  }

  function extractTitle(md) {
    if (!md) return "Document";
    var h1Match = md.match(/^#\s+(.*)$/m);
    var rawTitle = "";
    if (h1Match) {
      rawTitle = h1Match[1];
    } else {
      var plain = md.replace(/[#*_`>\-\[\]\(\)!~|]/g, " ").replace(/\s+/g, " ").trim();
      var words = plain.split(" ");
      rawTitle = words.slice(0, 2).join(" ");
    }
    rawTitle = rawTitle.replace(/[*_`~]/g, "").trim().substring(0, 20);
    if (!rawTitle) rawTitle = "Document";
    return rawTitle;
  }

  function generateHtml(bodyContent, docTitle) {
    var css = [
      "  body { font-family: serif; font-size: 16px; line-height: 2; color: #000; background: #fff;",
      "    margin: 0 auto; padding: 1in; max-width: 8.5in; }",
      "  p { margin: 0; text-indent: 0.5in; }",
      "  h1, h2, h3, h4, h5, h6 { font-size: 1em; font-weight: bold; margin: 0; text-indent: 0; line-height: 2; }",
      "  h1 { text-align: center; font-weight: normal; margin-bottom: 1em; }",
      "  ul, ol { margin: 0; padding-left: 1in; }",
      "  li { margin: 0; text-indent: 0; }",
      "  li p { text-indent: 0; }",
      "  blockquote { margin: 0; padding-left: 0.5in; }",
      "  hr { border: none; border-top: 1px solid #000; margin: 0; }",
      "  a { color: #000; text-decoration: underline; }",
      "  pre, code { font-family: monospace; font-size: 0.9em; }",
      "  pre { white-space: pre-wrap; text-indent: 0; margin: 0; line-height: 1.2; }",
      "  table { border-collapse: collapse; margin: 0 0 0 0.5in; line-height: 1.4; }",
      "  th, td { border: 1px solid #000; padding: 0.04in 0.15in; text-align: left; vertical-align: top;",
      "    font-variant-numeric: tabular-nums; }",
      "  th { font-weight: bold; }",
      "  img { max-width: 100%; }",
      "  del { text-decoration: line-through; }",
      "  ul.task-list { list-style: none; }",
      "  li.task-item { text-indent: 0; }",
      "  li.task-item input { margin-right: 0.1in; accent-color: #000; }"
    ].join("\n");

    return '<!DOCTYPE html>\n' +
      '<html lang="en">\n' +
      '<head>\n' +
      '<meta charset="utf-8">\n' +
      '<title>' + docTitle.replace(/</g, '&lt;') + '</title>\n' +
      '<style>\n' + css + '\n</style>\n' +
      '</head>\n' +
      '<body>\n' +
      bodyContent +
      '</body>\n' +
      '</html>';
  }

  var SAMPLE = [
    "# Field Notes",
    "",
    "A short specimen demonstrating **bold**, *italics*, ~~struck~~ text, `inline code`, and [a link](https://example.com).",
    "",
    "## Observations",
    "",
    "1. Basalt — fine-grained",
    "2. Granite — coarse-grained",
    "3. Slate — foliated",
    "",
    "| Sample | Hardness | Notes |",
    "| :--- | :---: | ---: |",
    "| A-01 | 6 | fractured |",
    "| A-02 | 3 | weathered |",
    "",
    "> All observations are provisional.",
    "> Recheck before citing.",
    "",
    "- [x] Catalogue drawer one",
    "- [ ] Catalogue drawer two",
    "",
    "```",
    "status: draft",
    "revised: 2026-09-24",
    "```"
  ].join("\n");

  var saved = null;
  try { saved = window.localStorage.getItem(KEY); } catch (e) {}
  if (mdInput) {
    mdInput.value = (saved !== null) ? saved : SAMPLE;
    mdInput.addEventListener("input", function () {
      try { window.localStorage.setItem(KEY, mdInput.value); } catch (e) {}
    });
  }

  function convert() {
    if (!mdInput || !htmlOutput || !previewFrame) return;
    var md = mdInput.value;
    var docTitle = extractTitle(md);
    var bodyHtml = parseMd(md);
    var fullHtml = generateHtml(bodyHtml, docTitle);
    htmlOutput.value = fullHtml;
    previewFrame.srcdoc = fullHtml;
  }

  if (btnConvert) btnConvert.addEventListener("click", convert);

  if (btnClear) {
    btnClear.addEventListener("click", function () {
      if (mdInput) mdInput.value = "";
      if (htmlOutput) htmlOutput.value = "";
      if (previewFrame) previewFrame.srcdoc = "";
      try { window.localStorage.removeItem(KEY); } catch (e) {}
    });
  }

  if (btnCopy) {
    btnCopy.addEventListener("click", function () {
      if (!htmlOutput || !htmlOutput.value) return;
      htmlOutput.select();
      try {
        document.execCommand("copy");
        if (copyMsg) {
          copyMsg.classList.add("show");
          setTimeout(function () { copyMsg.classList.remove("show"); }, 2000);
        }
      } catch (e) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(htmlOutput.value).then(function () {
            if (copyMsg) {
              copyMsg.classList.add("show");
              setTimeout(function () { copyMsg.classList.remove("show"); }, 2000);
            }
          });
        }
      }
    });
  }

  if (btnDownload) {
    btnDownload.addEventListener("click", function () {
      if (!htmlOutput || !htmlOutput.value || !mdInput) return;
      var docTitle = extractTitle(mdInput.value);
      var safeName = docTitle.replace(/[^a-z0-9]/gi, "_").substring(0, 20) || "document";
      var blob = new Blob([htmlOutput.value], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = safeName + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  if (mdInput && mdInput.value) convert();
})();
</script>
</body>
</html>
