<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown to HTML</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --ink-soft: #5a5a5a;
    --muted: #7d7d7d;
    --muted-fade: #b0b0b0;
    --done: #a9a9a9;
    --tint: #f4f4f4;
    --wash: #f7f7f7;
    --rule-soft: #e8e8e8;
  }

  html, body { background: var(--paper); }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(20px, 6vh, 72px) clamp(16px, 5vw, 40px);
    font-family: serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 800px;
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: clamp(20px, 4vw, 40px);
  }

  header {
    margin: 0 0 28px 0;
  }

  h1 {
    margin: 0;
    font-size: 1.1em;
    font-weight: normal;
    animation: breathe 16s ease-in-out infinite;
  }

  label {
    display: block;
    font-size: 0.85em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px 0;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    padding: 8px 10px;
    font-family: serif;
    font-size: 1em;
    line-height: 1.45;
    resize: vertical;
    margin: 0 0 24px 0;
    transition: border-color 0.6s ease;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin: 0 0 28px 0;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit; 
    font-size: 0.8em; 
    letter-spacing: 0.08em;
    text-transform: uppercase; 
    color: var(--ink); 
    background: transparent;
    border: 1px solid var(--ink); 
    padding: 6px 14px; 
    cursor: pointer;
    transition: color 0.6s ease, background-color 0.6s ease;
  }

  button:hover { 
    background: var(--ink); 
    color: var(--paper); 
  }

  iframe {
    width: 100%;
    height: 480px;
    border: 1px solid var(--ink);
    background: var(--paper);
    margin: 0 0 24px 0;
    box-sizing: border-box;
  }

  .output-header {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
  }

  .output-header label {
    margin: 0;
  }

  .copy-msg {
    font-size: 0.8em;
    color: var(--muted);
    margin-left: 12px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .copy-msg.show {
    opacity: 1;
  }

  :focus-visible { 
    outline: 1px solid var(--ink); 
    outline-offset: 2px; 
  }

  @keyframes breathe {
    0%, 100% { color: var(--ink); }
    50%      { color: var(--ink-soft); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Markdown to HTML</h1>
    </header>

    <section>
      <label for="md-input">Markdown</label>
      <textarea id="md-input" rows="12" aria-label="Markdown input" placeholder="# Title&#10;&#10;Write your text here..."></textarea>
    </section>

    <div class="controls">
      <button id="btn-convert" type="button">Convert</button>
      <button id="btn-clear" type="button">Clear</button>
    </div>

    <section>
      <label for="preview-frame">Preview</label>
      <iframe id="preview-frame" title="Rendered HTML preview"></iframe>
      
      <div class="output-header">
        <label for="html-output">HTML Source</label>
        <span id="copy-msg" class="copy-msg">Copied.</span>
      </div>
      <textarea id="html-output" rows="8" readonly aria-label="Generated HTML source"></textarea>
      <div class="controls">
        <button id="btn-copy" type="button">Copy Source</button>
        <button id="btn-download" type="button">Download HTML</button>
      </div>
    </section>
  </main>

<script>
(function () {
  "use strict";
  var KEY = "md-html-converter:v1";
  var mdInput = document.getElementById("md-input");
  var htmlOutput = document.getElementById("html-output");
  var previewFrame = document.getElementById("preview-frame");
  var btnConvert = document.getElementById("btn-convert");
  var btnClear = document.getElementById("btn-clear");
  var btnCopy = document.getElementById("btn-copy");
  var btnDownload = document.getElementById("btn-download");
  var copyMsg = document.getElementById("copy-msg");

  try {
    var saved = window.localStorage.getItem(KEY);
    if (saved && mdInput) mdInput.value = saved;
  } catch (e) {}

  if (mdInput) {
    mdInput.addEventListener("input", function () {
      try { window.localStorage.setItem(KEY, mdInput.value); } catch (e) {}
    });
  }

  function extractTitle(md) {
    if (!md) return "Document";
    var h1Match = md.match(/^#\s+(.*)$/m);
    var rawTitle = "";
    if (h1Match) {
      rawTitle = h1Match[1];
    } else {
      var plain = md.replace(/[#*_`>\-\[\]\(\)!]/g, " ").replace(/\s+/g, " ").trim();
      var words = plain.split(" ");
      rawTitle = words.slice(0, 2).join(" ");
    }
    rawTitle = rawTitle.replace(/[*_`]/g, "").trim().substring(0, 20);
    if (!rawTitle) rawTitle = "Document";
    return rawTitle;
  }

  function parseMd(md) {
    var codeBlocks = [];
    md = md.replace(/```([\s\S]*?)```/g, function (m, code) {
      codeBlocks.push("<pre><code>" + code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").trim() + "</code></pre>");
      return "\x00CODE" + (codeBlocks.length - 1) + "\x00";
    });

    md = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    var lines = md.split("\n");
    var html = "";
    var inUl = false;
    var inOl = false;
    var inBlockquote = false;
    var currentParagraph = [];

    function flushParagraph() {
      if (currentParagraph.length > 0) {
        var text = currentParagraph.join(" ").trim();
        if (text) html += "<p>" + text + "</p>\n";
        currentParagraph = [];
      }
    }

    function flushList() {
      if (inUl) { html += "</ul>\n"; inUl = false; }
      if (inOl) { html += "</ol>\n"; inOl = false; }
    }

    function flushBlockquote() {
      if (inBlockquote) { html += "</blockquote>\n"; inBlockquote = false; }
    }

    function inlineFormat(text) {
      var inlineCodes = [];
      text = text.replace(/`([^`]+)`/g, function (m, code) {
        inlineCodes.push("<code>" + code + "</code>");
        return "\x00INLINE" + (inlineCodes.length - 1) + "\x00";
      });
      
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      text = text.replace(/_([^_]+)_/g, "<em>$1</em>");
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

      text = text.replace(/\x00INLINE(\d+)\x00/g, function (m, idx) {
        return inlineCodes[parseInt(idx)];
      });
      return text;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      
      var codeMatch = line.match(/^\x00CODE(\d+)\x00$/);
      if (codeMatch) {
        flushParagraph(); flushList(); flushBlockquote();
        html += codeBlocks[parseInt(codeMatch[1])] + "\n";
        continue;
      }

      var hMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (hMatch) {
        flushParagraph(); flushList(); flushBlockquote();
        var level = hMatch[1].length;
        html += "<h" + level + ">" + inlineFormat(hMatch[2]) + "</h" + level + ">\n";
        continue;
      }

      if (/^(---|\*\*\*|___)$/.test(line.trim())) {
        flushParagraph(); flushList(); flushBlockquote();
        html += "<hr>\n";
        continue;
      }

      var bqMatch = line.match(/^&gt;\s?(.*)$/);
      if (bqMatch) {
        flushParagraph(); flushList();
        if (!inBlockquote) { html += "<blockquote>\n"; inBlockquote = true; }
        html += inlineFormat(bqMatch[1]) + "<br>\n";
        continue;
      } else if (inBlockquote && line.trim() === "") {
        flushBlockquote();
        continue;
      } else if (inBlockquote) {
        flushBlockquote();
      }

      var ulMatch = line.match(/^[-*+]\s+(.*)$/);
      if (ulMatch) {
        flushParagraph(); flushBlockquote();
        if (!inUl) { flushList(); html += "<ul>\n"; inUl = true; }
        html += "<li>" + inlineFormat(ulMatch[1]) + "</li>\n";
        continue;
      }

      var olMatch = line.match(/^\d+\.\s+(.*)$/);
      if (olMatch) {
        flushParagraph(); flushBlockquote();
        if (!inOl) { flushList(); html += "<ol>\n"; inOl = true; }
        html += "<li>" + inlineFormat(olMatch[1]) + "</li>\n";
        continue;
      }

      if ((inUl || inOl) && line.trim() === "") {
        flushList();
        continue;
      } else if ((inUl || inOl)) {
        flushList();
      }

      if (line.trim() === "") {
        flushParagraph();
        continue;
      }

      currentParagraph.push(inlineFormat(line));
    }

    flushParagraph();
    flushList();
    flushBlockquote();

    return html;
  }

  function generateHtml(bodyContent, docTitle) {
    return '<!DOCTYPE html>\n' +
      '<html lang="en">\n' +
      '<head>\n' +
      '<meta charset="utf-8">\n' +
      '<title>' + docTitle.replace(/</g, '&lt;') + '</title>\n' +
      '<style>\n' +
      '  body {\n' +
      '    font-family: serif;\n' +
      '    font-size: 16px;\n' +
      '    line-height: 2;\n' +
      '    color: #000;\n' +
      '    background: #fff;\n' +
      '    margin: 0 auto;\n' +
      '    padding: 1in;\n' +
      '    max-width: 8.5in;\n' +
      '  }\n' +
      '  p { margin: 0; text-indent: 0.5in; }\n' +
      '  h1, h2, h3, h4, h5, h6 {\n' +
      '    font-size: 1em;\n' +
      '    font-weight: bold;\n' +
      '    margin: 0;\n' +
      '    text-indent: 0;\n' +
      '    line-height: 2;\n' +
      '  }\n' +
      '  h1 { text-align: center; font-weight: normal; margin-bottom: 1em; }\n' +
      '  ul, ol { margin: 0; padding-left: 1in; }\n' +
      '  li { margin: 0; text-indent: 0; }\n' +
      '  blockquote { margin: 0; padding-left: 0.5in; text-indent: 0; }\n' +
      '  hr { border: none; border-top: 1px solid #000; margin: 0; }\n' +
      '  a { color: #000; text-decoration: underline; }\n' +
      '  pre, code { font-family: monospace; font-size: 0.9em; }\n' +
      '  pre { white-space: pre-wrap; text-indent: 0; margin: 0; line-height: 1.2; }\n' +
      '</style>\n' +
      '</head>\n' +
      '<body>\n' +
      bodyContent +
      '</body>\n' +
      '</html>';
  }

  function convert() {
    if (!mdInput || !htmlOutput || !previewFrame) return;
    var md = mdInput.value;
    var docTitle = extractTitle(md);
    var bodyHtml = parseMd(md);
    var fullHtml = generateHtml(bodyHtml, docTitle);
    htmlOutput.value = fullHtml;
    previewFrame.srcdoc = fullHtml;
  }

  if (btnConvert) btnConvert.addEventListener("click", convert);

  if (btnClear) {
    btnClear.addEventListener("click", function () {
      if (mdInput) mdInput.value = "";
      if (htmlOutput) htmlOutput.value = "";
      if (previewFrame) previewFrame.srcdoc = "";
      try { window.localStorage.removeItem(KEY); } catch (e) {}
    });
  }

  if (btnCopy) {
    btnCopy.addEventListener("click", function () {
      if (!htmlOutput || !htmlOutput.value) return;
      htmlOutput.select();
      try {
        document.execCommand("copy");
        if (copyMsg) {
          copyMsg.classList.add("show");
          setTimeout(function () { copyMsg.classList.remove("show"); }, 2000);
        }
      } catch (e) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(htmlOutput.value).then(function() {
            if (copyMsg) {
              copyMsg.classList.add("show");
              setTimeout(function () { copyMsg.classList.remove("show"); }, 2000);
            }
          });
        }
      }
    });
  }

  if (btnDownload) {
    btnDownload.addEventListener("click", function () {
      if (!htmlOutput || !htmlOutput.value || !mdInput) return;
      var docTitle = extractTitle(mdInput.value);
      var safeName = docTitle.replace(/[^a-z0-9]/gi, '_').substring(0, 20) || "document";
      var blob = new Blob([htmlOutput.value], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = safeName + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  if (mdInput && mdInput.value) {
    convert();
  }
})();
</script>
</body>
</html>
